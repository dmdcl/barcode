<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Generador de codigo de barras Dirgo Cloud</title>
<link rel="icon" type="image/png" href="weblogo.png">
<style>
  /* Fonts are vendored in vendor/fonts so the page never calls the network. */
  @font-face {
    font-family: 'Poppins'; font-weight: 600; font-style: normal; font-display: swap;
    src: url(vendor/fonts/poppins-600.woff2) format('woff2');
  }
  @font-face {
    font-family: 'Oswald'; font-weight: 500; font-style: normal; font-display: swap;
    src: url(vendor/fonts/oswald-500.woff2) format('woff2');
  }
  @font-face {
    font-family: 'Anonymous Pro'; font-weight: 400; font-style: normal; font-display: swap;
    src: url(vendor/fonts/anonymous-pro-400.woff2) format('woff2');
  }

  :root {
    --yellow-accent: #FFDE3D;   /* small titles that need to pop */
    --yellow-title: #E8C93B;    /* large titles */
    --yellow-soft: #F4E9B8;     /* backgrounds / accents */
    --black: #0D0D0D;
    --white: #F5F5F5;
    --grey-on-dark: #B4B4B4;
    --grey-on-light: #5C5C5C;
    --red: #FF8A80;             /* off-palette: palette has no error colour that passes contrast on black */
  }

  * { box-sizing: border-box; }

  body {
    font: 400 16px/1.5 'Anonymous Pro', ui-monospace, monospace;
    max-width: 44rem;
    margin: 0 auto;
    padding: 3rem 1.25rem 5rem;
    color: var(--white);
    background: var(--black);
  }

  .kicker {
    font: 500 13px/1 'Oswald', system-ui, sans-serif;
    text-transform: uppercase;
    letter-spacing: .18em;
    color: var(--yellow-accent);
    margin: 0 0 .5rem;
  }

  h1 {
    font: 600 clamp(32px, 7vw, 48px)/1.1 'Poppins', system-ui, sans-serif;
    color: var(--yellow-title);
    margin: 0 0 .5rem;
  }

  .lede { color: var(--grey-on-dark); margin: 0 0 2.5rem; max-width: 34rem; }

  label {
    display: block;
    font: 500 13px/1 'Oswald', system-ui, sans-serif;
    text-transform: uppercase;
    letter-spacing: .14em;
    color: var(--yellow-accent);
    margin: 1.75rem 0 .5rem;
  }

  input, select, button { font: inherit; padding: .7rem .8rem; border-radius: 4px; }

  input, select {
    width: 100%;
    border: 1px solid #3A3A3A;
    background: #161616;
    color: var(--white);
  }
  input::placeholder { color: var(--grey-on-dark); }
  input[aria-invalid="true"] { border-color: var(--red); }

  #error {
    color: var(--red);
    min-height: 1.5rem;
    margin: .75rem 0 0;
    font-size: 14px;
  }

  /* Preview stays white: scanners and printed output expect dark bars on light. */
  #preview {
    display: grid;
    place-items: center;
    padding: 1.5rem;
    margin: 1.25rem 0 2rem;
    border-radius: 6px;
    background: var(--yellow-soft);
    min-height: 9rem;
  }
  #barcode-svg { max-width: 100%; height: auto; }

  .actions { display: flex; gap: .75rem; flex-wrap: wrap; }

  button {
    font: 500 14px/1 'Oswald', system-ui, sans-serif;
    text-transform: uppercase;
    letter-spacing: .12em;
    padding: .85rem 1.4rem;
    cursor: pointer;
    border: 1px solid var(--yellow-accent);
    background: var(--yellow-accent);
    color: var(--black);
  }
  button.secondary { background: transparent; color: var(--yellow-accent); }
  button:disabled { cursor: not-allowed; opacity: .35; }

  :focus-visible { outline: 3px solid var(--yellow-accent); outline-offset: 2px; }
</style>
</head>
<body>
<p class="kicker">Dirgo Cloud</p>
<h1>Generador de codigo de barras</h1>
<p class="lede">Ingresa los datos, elige un formato para descargar. (PNG es una imagen, SVG son vectores).</p>

<label for="data">Datos a generar</label>
<input id="data" type="text" autocomplete="off" autocapitalize="off" spellcheck="false"
       aria-describedby="error" value="HOLA-123">

<label for="format">Formato</label>
<select id="format">
  <option value="CODE128" selected>CODE128 (any ASCII)</option>
  <option value="EAN13">EAN-13 (12 digits, check digit added)</option>
  <option value="UPC">UPC-A (11 digits, check digit added)</option>
  <option value="CODE39">CODE39 (letters, digits, - . $ / + % space; upper-cased)</option>
</select>

<p id="error" role="status" aria-live="polite"></p>

<div id="preview"><svg id="barcode-svg" role="img" aria-label="Barcode preview"></svg></div>

<div class="actions">
  <button id="dl-svg" type="button" disabled>Descargar SVG</button>
  <button id="dl-png" type="button" class="secondary" disabled>Descargar PNG</button>
</div>

<script src="vendor/JsBarcode.all.min.js"></script>
<script>
const PNG_SCALE = 3;
const dataEl = document.getElementById('data');
const formatEl = document.getElementById('format');
const errorEl = document.getElementById('error');
const svgEl = document.getElementById('barcode-svg');
const dlSvg = document.getElementById('dl-svg');
const dlPng = document.getElementById('dl-png');

// Numeric formats: accept the data with or without a check digit, then drop any
// supplied check digit so JsBarcode always recalculates it (never reject theirs).
const NUMERIC = {
  EAN13: { re: /^\d{12,13}$/, keep: 12, hint: 'EAN-13 needs 12 digits (13 if you include a check digit).' },
  UPC:   { re: /^\d{11,12}$/, keep: 11, hint: 'UPC-A needs 11 digits (12 if you include a check digit).' }
};

function prepare(value, format) {
  if (format === 'CODE39') return { value: value.toUpperCase() }; // CODE39 has no lowercase
  const n = NUMERIC[format];
  if (!n) return { value };
  if (!n.re.test(value)) return { error: n.hint };
  return { value: value.slice(0, n.keep) };
}

function filename(value, format, ext) {
  const slug = value.replace(/[^A-Za-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 40) || 'code';
  return `barcode-${slug}-${format}.${ext}`;
}

let current = null; // last successfully rendered { value, format }

function render() {
  const raw = dataEl.value.trim();
  const format = formatEl.value;
  current = null;
  svgEl.replaceChildren();
  svgEl.removeAttribute('width');
  svgEl.removeAttribute('height');

  let message = '';
  if (raw) {
    const { value, error } = prepare(raw, format);
    if (error) {
      message = error;
    } else {
      let ok = false;
      JsBarcode(svgEl, value, { format, displayValue: true, valid: v => ok = v });
      if (ok) current = { value, format };
      else { svgEl.replaceChildren(); message = `"${raw}" is not valid ${format} data.`; }
    }
  }

  errorEl.textContent = message;
  dataEl.setAttribute('aria-invalid', message ? 'true' : 'false');
  svgEl.setAttribute('aria-label', current ? `${format} barcode for ${current.value}` : 'No barcode');
  dlSvg.disabled = dlPng.disabled = !current;
}

function save(blob, name) {
  const url = URL.createObjectURL(blob);
  const a = Object.assign(document.createElement('a'), { href: url, download: name });
  a.click();
  URL.revokeObjectURL(url);
}

function svgString() {
  return new XMLSerializer().serializeToString(svgEl);
}

dlSvg.addEventListener('click', () => {
  save(new Blob([svgString()], { type: 'image/svg+xml' }),
       filename(current.value, current.format, 'svg'));
});

dlPng.addEventListener('click', () => {
  const img = new Image();
  img.onload = () => {
    const canvas = document.createElement('canvas');
    canvas.width = img.width * PNG_SCALE;
    canvas.height = img.height * PNG_SCALE;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    canvas.toBlob(b => save(b, filename(current.value, current.format, 'png')), 'image/png');
  };
  // Data URI (not a blob URL) so the canvas is never tainted, including on file://
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgString());
});

let timer;
dataEl.addEventListener('input', () => {
  clearTimeout(timer);
  timer = setTimeout(render, 350);
});
formatEl.addEventListener('change', render);
render();

// Open with #selftest to check the input rules in the console.
if (location.hash === '#selftest') {
  const eq = (a, b, m) => console.assert(JSON.stringify(a) === JSON.stringify(b), m, a);
  eq(prepare('123456789012', 'EAN13').value, '123456789012', 'EAN13 12 digits pass through');
  eq(prepare('1234567890128', 'EAN13').value, '123456789012', 'EAN13 drops supplied check digit');
  eq(prepare('0000000000000', 'EAN13').value, '000000000000', 'EAN13 wrong check digit still accepted');
  eq(!!prepare('12345678901234', 'EAN13').error, true, 'EAN13 too long rejected');
  eq(!!prepare('12345abc9012', 'EAN13').error, true, 'EAN13 non-numeric rejected');
  eq(prepare('01234567891', 'UPC').value, '01234567891', 'UPC 11 digits pass through');
  eq(prepare('012345678912', 'UPC').value, '01234567891', 'UPC drops supplied check digit');
  eq(prepare('anything', 'CODE128').value, 'anything', 'CODE128 unrestricted');
  eq(prepare('ab-1', 'CODE39').value, 'AB-1', 'CODE39 uppercased');
  eq(filename('Hello World!', 'CODE128', 'svg'), 'barcode-Hello-World-CODE128.svg', 'filename sanitized');
  eq(filename('///', 'CODE39', 'png'), 'barcode-code-CODE39.png', 'filename fallback');
  console.log('selftest done');
}
</script>
</body>
</html>
